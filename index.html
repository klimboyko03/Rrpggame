<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dungeon Tap RPG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#0e0e1a;
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;
}
#game{
    max-width:420px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* Top bar */
.top{
    display:flex;
    justify-content:space-around;
    padding:8px;
    background:#141428;
    font-size:14px;
}

/* Battle area */
.battle-area{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* HP */
.hp-bar{
    width:80%;
    height:12px;
    background:#222;
    border-radius:6px;
    overflow:hidden;
    margin:8px 0;
}
.hp-fill{
    height:100%;
    background:#2ecc71;
    transition:width 0.2s;
}
.hp-fill.low{
    background:#e74c3c;
}

/* Enemy */
.enemy{
    font-size:90px;
    cursor:pointer;
    user-select:none;
}

/* Floating damage */
.dmg{
    position:absolute;
    font-weight:bold;
    animation:floatUp 1s forwards;
}
@keyframes floatUp{
    0%{opacity:1;transform:translateY(0);}
    100%{opacity:0;transform:translateY(-80px);}
}

/* Overlay */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:20;
}
.overlay.show{
    display:flex;
}

/* Rage */
.rage-overlay{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,0.25);
    display:none;
    z-index:8;
}
.rage-overlay.active{
    display:block;
    animation:ragePulse 1s infinite alternate;
}
@keyframes ragePulse{
    from{opacity:0.3;}
    to{opacity:0.6;}
}

/* Dungeon Map */
.dungeon-map{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    padding:4px;
}
.map-room{
    background:#1b1b2f;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
}
.map-room.current{
    border:2px solid gold;
}
.map-room.completed{
    background:#1f6f3d;
}
.map-room.boss{
    background:#7f0000;
    animation:bossPulse 1.5s infinite alternate;
}
@keyframes bossPulse{
    from{opacity:0.8;}
    to{opacity:1;}
}

/* Inventory */
.inventory{
    max-height:200px;
    overflow:auto;
    padding:5px;
}
.artifacts{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    margin-top:10px;
}
.artifact{
    background:#111;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}
.artifact.collected{
    border:2px solid gold;
    box-shadow:0 0 8px gold;
}
</style>
</head>

<body>
<div id="game">

<div class="top">
<div>💰 <span id="gold">0</span></div>
<div>💎 <span id="gems">0</span></div>
<div>⚔️ <span id="damage">10</span></div>
</div>

<div class="battle-area" id="battleArea">

<div class="dungeon-map" id="dungeonMap"></div>

<div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
<div>❤️ <span id="hpText"></span></div>

<div class="enemy" id="enemy">👾</div>

<div class="rage-overlay" id="rageOverlay"></div>

<!-- Lottery -->
<div class="overlay" id="lotteryOverlay">
<h2>🎰 ЛОТЕРЕЯ БОССА!</h2>
<div style="font-size:60px">🎰</div>
<div id="lotteryResult" style="margin:10px"></div>
<button onclick="spinLottery()">Крутить</button>
<button onclick="closeLottery()">Закрыть</button>
</div>

</div>

<div class="inventory" id="inventoryPanel">
<h3>🎒 Инвентарь</h3>
<div id="inventorySlots"></div>

<h3>🏆 АРТЕФАКТЫ БОССОВ (5% шанс)</h3>
<div class="artifacts" id="artifactGrid"></div>
</div>

</div>

<script>
/* Telegram */
if(window.Telegram?.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

/* State */
let gold=0;
let gems=0;
let baseDamage=10;
let playerHp=100;
let playerMaxHp=100;
let enemyHp=50;
let enemyMaxHp=50;
let isRageMode=false;

let inventory=[];
let bossArtifacts=['👑','💀','🔥','💎','🌑','✨','🌌','💥','⏳','🌀'];
let collectedArtifacts=[];
let currentBossIndex=0;

let dungeonRooms=[];
let currentRoom=0;

/* Save/Load */
function saveGame(){
    localStorage.setItem("dungeonSave",JSON.stringify({
        gold,gems,baseDamage,inventory,collectedArtifacts,currentRoom,dungeonRooms
    }));
}
function loadGame(){
    let data=JSON.parse(localStorage.getItem("dungeonSave"));
    if(data){
        gold=data.gold||0;
        gems=data.gems||0;
        baseDamage=data.baseDamage||10;
        inventory=data.inventory||[];
        collectedArtifacts=data.collectedArtifacts||[];
        dungeonRooms=data.dungeonRooms||[];
        currentRoom=data.currentRoom||0;
    }
}

/* Dungeon */
function generateDungeon(){
    dungeonRooms=[];
    for(let i=0;i<25;i++){
        let r=Math.random();
        if(r<0.6)dungeonRooms.push("battle");
        else if(r<0.7)dungeonRooms.push("treasure");
        else if(r<0.8)dungeonRooms.push("trap");
        else if(r<0.88)dungeonRooms.push("altar");
        else if(r<0.95)dungeonRooms.push("boss");
        else dungeonRooms.push("shop");
    }
}
function renderMap(){
    let map=document.getElementById("dungeonMap");
    map.innerHTML="";
    dungeonRooms.forEach((type,i)=>{
        let div=document.createElement("div");
        div.className="map-room";
        if(i===currentRoom)div.classList.add("current");
        if(type==="boss")div.classList.add("boss");
        div.textContent={
            battle:"⚔️",
            treasure:"💰",
            trap:"⚠️",
            altar:"🙏",
            boss:"👑",
            shop:"🛒"
        }[type];
        div.onclick=()=>{ if(Math.abs(i-currentRoom)===1) enterRoom(i); };
        map.appendChild(div);
    });
}
function enterRoom(index){
    currentRoom=index;
    let type=dungeonRooms[index];
    if(type==="battle") spawnEnemy();
    if(type==="boss"){ spawnEnemy(true); }
    if(type==="treasure"){ gold+=100; generateItem(); }
    if(type==="trap"){ playerHp-=20; gold+=50; }
    if(type==="altar"){ playerHp=playerMaxHp; baseDamage+=5; }
    updateUI();
    renderMap();
    saveGame();
}

/* Enemy */
function spawnEnemy(isBoss=false){
    enemyMaxHp=isBoss?200:50;
    enemyHp=enemyMaxHp;
    document.getElementById("enemy").textContent=isBoss?"🐉":"👾";
    updateHpBar();
}
function killEnemy(){
    gold+=50;
    if(dungeonRooms[currentRoom]==="boss"){
        if(Math.random()<0.05){
            let art=bossArtifacts[currentBossIndex%bossArtifacts.length];
            if(!collectedArtifacts.includes(art)){
                collectedArtifacts.push(art);
            }
        }
        currentBossIndex++;
        showLottery();
    }
    saveGame();
}

/* Damage */
function getTotalDamage(){
    let total=baseDamage;
    if(isRageMode) total*=2;
    return total;
}
function attack(e){
    if(enemyHp<=0)return;
    let dmg=getTotalDamage();
    enemyHp-=dmg;
    showDamage(dmg,e);
    if(enemyHp<=0) killEnemy();
    updateHpBar();
}

/* HP */
function updateHpBar(){
    let fill=document.getElementById("hpFill");
    fill.style.width=(enemyHp/enemyMaxHp*100)+"%";
    if(playerHp<playerMaxHp*0.2 && !isRageMode){
        isRageMode=true;
        document.getElementById("rageOverlay").classList.add("active");
        setTimeout(()=>{
            isRageMode=false;
            document.getElementById("rageOverlay").classList.remove("active");
        },10000);
    }
}

/* Damage Text */
function showDamage(dmg,e){
    let div=document.createElement("div");
    div.className="dmg";
    div.style.left=e.clientX+"px";
    div.style.top=e.clientY+"px";
    div.textContent="-"+dmg;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),1000);
}

/* Lottery */
function showLottery(){
    document.getElementById("lotteryOverlay").classList.add("show");
}
function closeLottery(){
    document.getElementById("lotteryOverlay").classList.remove("show");
}
function spinLottery(){
    let prizes=[
        "💰 500 золота",
        "🎁 Редкий предмет",
        "🎁 2 предмета",
        "💎 1 камень престижа",
        "💰 2000 золота"
    ];
    let win=prizes[Math.floor(Math.random()*prizes.length)];
    document.getElementById("lotteryResult").textContent=win;

    if(win.includes("500")) gold+=500;
    if(win.includes("2000")) gold+=2000;
    if(win.includes("2")){ generateItem(); generateItem(); }
    if(win.includes("Редкий")) generateItem();
    if(win.includes("💎")) gems++;

    updateUI();
    saveGame();
}

/* Inventory */
function generateItem(){
    inventory.push("⚔️");
    renderInventory();
}
function renderInventory(){
    let div=document.getElementById("inventorySlots");
    div.innerHTML=inventory.join(" ");
    renderArtifacts();
}
function renderArtifacts(){
    let grid=document.getElementById("artifactGrid");
    grid.innerHTML="";
    for(let i=0;i<10;i++){
        let cell=document.createElement("div");
        cell.className="artifact";
        if(collectedArtifacts[i]){
            cell.textContent=collectedArtifacts[i];
            cell.classList.add("collected");
        }else{
            cell.textContent="❓";
        }
        grid.appendChild(cell);
    }
}

/* UI */
function updateUI(){
    document.getElementById("gold").textContent=gold;
    document.getElementById("gems").textContent=gems;
    document.getElementById("damage").textContent=getTotalDamage();
}

/* Init */
loadGame();
if(dungeonRooms.length===0) generateDungeon();
renderMap();
renderInventory();
spawnEnemy();
updateUI();

document.getElementById("enemy").addEventListener("touchstart",attack,{passive:false});
</script>

</body>
</html>
